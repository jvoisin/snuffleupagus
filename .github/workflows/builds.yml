name: CI for php versions
on:
  pull_request:
  push:
  schedule:
    - cron: '0 16 * * 5'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
          container:
            - php:8.6
            - php:8.5-zts
            - php:8.5
            - php:8.4-zts
            - php:8.4
            - php:8.3-zts
            - php:8.3
            - php:8.2-zts
            - php:8.2
            - php:8.1-zts
            - php:8.1
            - php:8.0-zts
            - php:8.0
            - php:7.4-zts
            - php:7.4
            - php:7.3-zts
            - php:7.3
            - php:7.2-zts
            - php:7.2
            - php:7.1-zts
            - php:7.1
    container: ${{ matrix.container }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: PHP 7 env setup
        if: startsWith(matrix.container, 'php:7')
        run: |
          pecl install vld-beta
          rm -rf src/tests/*php8*/ src/tests/*/*_php8.phpt
      - name: Build and run the testsuite
        run: |
          make release
          if [ "$(php -r 'echo PHP_ZTS;')" = "1" ]; then
            cc -shared -fPIC -DZEND_ENABLE_STATIC_TSRMLS_CACHE=1 $(php-config --includes) \
              src/tests/zts/thread_probe.c -pthread -o src/modules/sp_zts_test.so
          fi
          ln -s $(php -r 'echo ini_get("extension_dir");')/* src/modules/
          rm -f src/tests/disable_function/*_signal.phpt
          make tests
      - name: Show logs in case of failure
        if: ${{ failure() }}
        run: |
          grep -r . --include='*.log' src/tests
