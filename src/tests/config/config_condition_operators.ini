; Regression test for the config scanner's condition operators.
; `>` is strict, so `5 > 5` is false and strtolower stays enabled.
@condition 5 > 5;
sp.disable_function.function("strtolower").drop();
@end_condition;
; `>=` and `<=` must include the boundary, so this condition is true.
@condition 5 >= 5 && 5 <= 5;
sp.disable_function.function("strtoupper").drop();
@end_condition;
